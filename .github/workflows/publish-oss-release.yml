name: Publish IqraAI Open Source Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version / Tag (e.g., v1.0.0)'
        required: true
        type: string
      description:
        description: 'Release Description (Will be added alongside auto-generated commit notes)'
        required: false
        type: string

env:
  DOCKER_ORG: abdofallah

jobs:
  # 1. STRICT GUARDRAIL JOB
  verify-repository:
    name: Verify Open-Source Repository
    runs-on: ubuntu-latest
    steps:
      - name: Check if repo is abdofallah/IqraAI
        run: |
          if [ "${{ github.repository }}" != "abdofallah/IqraAI" ]; then
            echo "❌ FATAL ERROR: This workflow is strictly for the open-source repository!"
            echo "It was triggered on: ${{ github.repository }}"
            echo "Failing the workflow immediately to prevent accidental publishing."
            exit 1
          else
            echo "✅ Repository verified: ${{ github.repository }}. Proceeding Bismillah..."
          fi

  # 2. DOCKER PUBLISH JOB
  publish-docker:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: verify-repository # Waits for the guardrail job to pass
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend
        run: |
          docker build --target frontend_target \
            -t ${{ env.DOCKER_ORG }}/iqraai-frontend:${{ github.event.inputs.version }} \
            -t ${{ env.DOCKER_ORG }}/iqraai-frontend:latest \
            -f Dockerfile.unified .
          docker push -a ${{ env.DOCKER_ORG }}/iqraai-frontend

      - name: Build & Push Backend
        run: |
          docker build --target backend_target \
            -t ${{ env.DOCKER_ORG }}/iqraai-backend:${{ github.event.inputs.version }} \
            -t ${{ env.DOCKER_ORG }}/iqraai-backend:latest \
            -f Dockerfile.unified .
          docker push -a ${{ env.DOCKER_ORG }}/iqraai-backend

      - name: Build & Push Proxy
        run: |
          docker build --target proxy_target \
            -t ${{ env.DOCKER_ORG }}/iqraai-proxy:${{ github.event.inputs.version }} \
            -t ${{ env.DOCKER_ORG }}/iqraai-proxy:latest \
            -f Dockerfile.unified .
          docker push -a ${{ env.DOCKER_ORG }}/iqraai-proxy

      - name: Build & Push Background Processor
        run: |
          docker build --target background_target \
            -t ${{ env.DOCKER_ORG }}/iqraai-background:${{ github.event.inputs.version }} \
            -t ${{ env.DOCKER_ORG }}/iqraai-background:latest \
            -f Dockerfile.unified .
          docker push -a ${{ env.DOCKER_ORG }}/iqraai-background

  # 3. BINARY BUILD JOB
  build-binaries:
    name: Build Binaries (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: verify-repository # Waits for the guardrail job to pass
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, win-x64, win-arm64, osx-x64, osx-arm64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          include-prerelease: true

      - name: Publish Standalone Binaries
        run: |
          dotnet publish "ProjectIqraFrontend/ProjectIqraFrontend.csproj" -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o publish/frontend
          dotnet publish "ProjectIqraBackendApp/ProjectIqraBackendApp.csproj" -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o publish/backend
          dotnet publish "ProjectIqraBackendProxy/ProjectIqraBackendProxy.csproj" -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o publish/proxy
          dotnet publish "IqraBackgroundProcessor/IqraBackgroundProcessor.csproj" -c Release -r ${{ matrix.target }} --self-contained true -p:PublishSingleFile=true -o publish/background

      - name: Zip Artifacts for Release
        run: |
          cd publish/frontend && zip -r ../../iqraai-frontend-${{ matrix.target }}.zip . && cd ../..
          cd publish/backend && zip -r ../../iqraai-backend-${{ matrix.target }}.zip . && cd ../..
          cd publish/proxy && zip -r ../../iqraai-proxy-${{ matrix.target }}.zip . && cd ../..
          cd publish/background && zip -r ../../iqraai-background-${{ matrix.target }}.zip . && cd ../..

      - name: Upload Artifacts Temporarily
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: '*.zip'
          retention-days: 1

  # 4. GITHUB RELEASE JOB
  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Wait for the binaries to be built successfully first
    needs: build-binaries 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all compiled binaries
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          pattern: binaries-*
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: IqraAI ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.description }}
          generate_release_notes: true 
          files: release_assets/*.zip